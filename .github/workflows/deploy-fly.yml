# ─────────────────────────────────────────────────────────────────────────────
# Future Self Formative Study — deploy to Fly.io from a button on GitHub
#
# HOW TO RUN THIS
#   GitHub.com → your repo → "Actions" tab → "Deploy to Fly.io" in the left
#   sidebar → "Run workflow" button on the right → choose what to deploy → Run.
#
# You never need a terminal. GitHub rents a temporary computer, runs the
# commands on it, shows you the output, and throws the computer away.
#
# WHY THERE IS NO AUTOMATIC DEPLOY ON PUSH
#   This runs ONLY when you click the button. That is deliberate. Participants
#   use these apps live during sessions, and a stray commit should never be
#   able to change what a participant sees. You decide when a change ships.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to deploy"
        required: true
        default: "create-apps-only"
        type: choice
        options:
          # Run this FIRST. Creates the three empty apps so they show up in the
          # Fly dashboard, where you then add your secrets. Deploys nothing.
          - create-apps-only
          # Run this SECOND, after the secrets are in. Deploys all three.
          - all
          # Deploy just one app — useful when you change a single chatbot prompt.
          - chatbot1
          - chatbot2
          - scheduler

# Never let two deploys run at the same time.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ inputs.target }})
    runs-on: ubuntu-latest

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # ── Preflight ───────────────────────────────────────────────────────────
      # Checks the token before doing anything, and prints the exact list of
      # organizations it can see. If app creation later fails, that printed
      # list is what tells us the right value to use.
      - name: Preflight — check the token and list your organizations
        run: |
          echo "flyctl version: $(flyctl version || true)"

          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is empty."
            echo "::error::Add it at: Settings → Secrets and variables → Actions → New repository secret."
            echo "::error::The name must be exactly FLY_API_TOKEN."
            exit 1
          fi

          echo "Token received: ${#FLY_API_TOKEN} characters long."
          case "$FLY_API_TOKEN" in
            FlyV1*)
              echo "Token format looks correct (begins with FlyV1)." ;;
            *)
              echo "::warning::Your token does not begin with 'FlyV1'."
              echo "::warning::You may have missed the start when copying. Fly shows it once —"
              echo "::warning::if unsure, create a fresh token and re-paste the WHOLE thing." ;;
          esac

          echo ""
          echo "─── Organizations this token can see ───"
          if ! flyctl orgs list; then
            echo "::error::Could not list organizations, which means the token was rejected."
            echo "::error::Most likely causes, in order:"
            echo "::error::  1. The token is read-only. Create a STANDARD org token, not a read-only one."
            echo "::error::  2. Part of the token was missed when copying (it must start with 'FlyV1 ')."
            echo "::error::  3. The token expired."
            echo "::error::Fix: Fly dashboard → Tokens → create a new one → replace FLY_API_TOKEN on GitHub."
            exit 1
          fi
          echo "───────────────────────────────────────"

      - name: Create the three apps if they do not exist yet
        run: |
          ORG="${{ vars.FLY_ORG || 'personal' }}"
          echo "Creating apps in organization: $ORG"
          echo ""

          FAILED=0
          for app in fsf-chatbot1 fsf-chatbot2 fsf-scheduler; do
            if flyctl apps list 2>/dev/null | awk '{print $1}' | grep -qx "$app"; then
              echo "✓ $app already exists — leaving it alone"
              continue
            fi

            echo "→ creating $app"
            if flyctl apps create "$app" --org "$ORG"; then
              echo "✓ created $app"
            else
              echo "::error::Could not create $app in organization '$ORG'."
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "::error::App creation failed. Check the organization list printed by the"
            echo "::error::previous step. If your organization is NOT called 'personal',"
            echo "::error::copy its slug and add it on GitHub under:"
            echo "::error::  Settings → Secrets and variables → Actions → Variables tab"
            echo "::error::  → New repository variable → Name: FLY_ORG, Value: <the slug>"
            echo "::error::Then run this workflow again."
            echo "::error::"
            echo "::error::If instead the error above says the NAME IS TAKEN, someone else"
            echo "::error::already owns that app name. Tell Claude and it will rename all three."
            exit 1
          fi

      - name: Deploy Chatbot 1
        if: inputs.target == 'all' || inputs.target == 'chatbot1'
        run: flyctl deploy --remote-only --config fly.chatbot1.toml

      - name: Deploy Chatbot 2
        if: inputs.target == 'all' || inputs.target == 'chatbot2'
        run: flyctl deploy --remote-only --config fly.chatbot2.toml

      - name: Deploy the SMS scheduler
        if: inputs.target == 'all' || inputs.target == 'scheduler'
        run: flyctl deploy --remote-only --config fly.scheduler.toml

      # ── Safety check ────────────────────────────────────────────────────────
      # Supercronic fires on every machine it runs on. Two machines would mean
      # every participant receives two identical check-in texts. This fails the
      # run loudly rather than letting that reach a participant.
      - name: Confirm the scheduler is running exactly one machine
        if: inputs.target == 'all' || inputs.target == 'scheduler'
        run: |
          COUNT=$(flyctl machines list -a fsf-scheduler --json | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Scheduler machine count: $COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::The scheduler has $COUNT machines but must have exactly 1."
            echo "::error::More than one machine means participants get duplicate check-in texts."
            echo "::error::Fix it in the Fly dashboard: fsf-scheduler → Machines → destroy the extras."
            exit 1
          fi
          echo "✓ Exactly one scheduler machine — no duplicate-text risk."

      - name: What to do next
        if: success() && inputs.target == 'create-apps-only'
        run: |
          {
            echo "## Apps created"
            echo ""
            echo "The three apps now exist but nothing is deployed yet."
            echo ""
            echo "**Next:** go to the Fly dashboard and add each app's secrets"
            echo "(fly.io/dashboard → the app → Secrets). Then come back here and"
            echo "run this workflow again with **all** selected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success() && inputs.target != 'create-apps-only'
        run: |
          {
            echo "## Deploy finished"
            echo ""
            echo "| App | URL |"
            echo "|---|---|"
            echo "| Chatbot 1 | https://fsf-chatbot1.fly.dev/?pid=TEST01 |"
            echo "| Chatbot 2 | https://fsf-chatbot2.fly.dev/?pid=TEST01 |"
            echo "| Scheduler | no website — background worker |"
            echo ""
            echo "If a chatbot shows an error, its secrets are probably missing."
            echo "Add them at: fly.io/dashboard → the app → Secrets."
          } >> "$GITHUB_STEP_SUMMARY"
