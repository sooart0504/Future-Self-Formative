# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — never put real keys in this file, and never commit real keys.
#
# Copy this to a file called  secrets.toml  OUTSIDE the repo folder (for
# example on your Desktop), fill in the real values, and upload it to Fly with:
#
#   fly secrets set STREAMLIT_SECRETS_TOML="$(cat ~/Desktop/secrets.toml)" -a fsf-chatbot1
#   fly secrets set STREAMLIT_SECRETS_TOML="$(cat ~/Desktop/secrets.toml)" -a fsf-chatbot2
#
# These are the exact same values you already have in the Streamlit Cloud
# secrets manager. Copy them from there.
# ─────────────────────────────────────────────────────────────────────────────

OPENAI_API_KEY   = "sk-..."
OPENAI_API_BASE  = "https://api.openai.com/v1"

LANGCHAIN_API_KEY = "ls__..."
LANGCHAIN_PROJECT = "future-self-formative"

# The long ID from the middle of your Google Sheet's URL:
# https://docs.google.com/spreadsheets/d/THIS_PART_HERE/edit
GOOGLE_SHEET_KEY = "1wxyeAYdKC7f5LcvOxuhtYHg8MQdF41zjOoYgMPhOr2k"

# Optional — only needed if you rename the config files.
# CONFIG_FILE_CB1 = "chatbot1_config.toml"
# CONFIG_FILE_CB2 = "chatbot2_config.toml"

# Paste your Google Cloud service account key here, field by field.
# This is the same block you already have in Streamlit Cloud.
[gcp_service_account]
type                        = "service_account"
project_id                  = "your-project-id"
private_key_id              = "..."
private_key                 = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email                = "your-service-account@your-project.iam.gserviceaccount.com"
client_id                   = "..."
auth_uri                    = "https://accounts.google.com/o/oauth2/auth"
token_uri                   = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url        = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com"
universe_domain             = "googleapis.com"
