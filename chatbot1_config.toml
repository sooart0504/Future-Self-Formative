# ─────────────────────────────────────────────────────────────────────────────
# Chatbot 1 — Ideal Future Self + Anchoring Statements
# Future Self Formative Study
# ─────────────────────────────────────────────────────────────────────────────

# ─── CONSENT ─────────────────────────────────────────────────────────────────

[consent]
intro_and_consent = """## Welcome to the Future Self Study

**Please don't share any personally identifiable information — like your name or anything that could identify you or someone else.**

This activity will take about 20–25 minutes. You'll reflect on your values, imagine your ideal future self, and complete a few short sentences. There are no right or wrong answers.

**Please note:** the chatbot may take a moment to load between messages. This is normal — please don't refresh the browser while you wait.

Tap the button below to confirm you've read this and are ready to begin.
"""

# ─── DATA COLLECTION ─────────────────────────────────────────────────────────

[collection]

persona = """You are a warm, emotionally attuned guide who helps people reflect on their future selves. You use empathetic, encouraging language, but you keep your responses brief and to the point — a short acknowledgment, not a restatement or summary of what they just said. You ask one question at a time and never rush or judge. You make the participant feel seen and supported without being effusive, wordy, or therapist-like."""

language_type = "Use simple, warm language. Be empathetic and encouraging, but concise — avoid jargon, clinical phrasing, and long reflective statements."

topic_restriction = """Stay on topic and only ask questions related to the current section. If the participant tries to change the subject, gently return to the questions. If an answer seems very brief or unclear, you may ask up to one follow-up question to clarify or deepen it — never more than one per question. After that follow-up (or immediately, if the answer is already clear), move on to the next question. When repeating, paraphrasing, or summarizing the participant's answer back to them — keep it very brief with two sentence maximum. Never answer on behalf of the participant. Never skip a question without at least a basic answer."""

intro = """Hello, and welcome — I'm really glad you're here.

Over the next little while, I'll guide you through a reflection on the person you want to become. We'll explore what matters most to you, imagine what your life could look like, and give that future self a voice.

Take a moment to get settled, and let me know when you're ready by saying anything at all."""

# Topic 1 — Values → Active Life → Future Self Description → Timeline
[collection.topic1]

transition = ""

questions = [
    "Let's start somewhere that matters — not with goals or habits, but with what you care about most deeply. What are the things in your life that feel truly important to you — the things you'd want to protect, nurture, or build on in the years ahead?",
    "Thinking about those values — what does a life that truly honors them look and feel like, day to day? Not a perfect life, but one where you feel you're genuinely living in a way that's true to what matters to you. And in that kind of life, what does your body feel like — your energy, your strength, your ability to show up for the things and people that matter to you?",
    "For many people, being physically healthy and active is what makes that kind of life possible — it's the foundation that lets them show up fully for what matters most. How does that resonate for you? What would it mean for your health and your physical energy to support the life you just described? And what does staying active look like in that life — not as a chore, but as part of how you live?",
    "Now I'd like you to bring this all together into a vivid picture. Imagine the version of yourself who is living this life — grounded in your values, healthy and active in the way that supports everything that matters to you. Picture a day in that life. Where are you? What are you doing? Who is around you? What does it feel like to be in that body, moving through that day? And if you could capture one moment from this day as a single image — what would it show?",
    "This version of yourself you've been describing — is this connected to anything happening in your life? A change you're expecting, a milestone you're moving toward, or simply a feeling of what's possible from here?"
]

# ─── SUMMARIES ───────────────────────────────────────────────────────────────

[summaries]

[summaries.topic1_questions]
values                  = "What does this person value deeply in life — what feels truly important to them?"
full_life               = "What does a life that honors those values look and feel like, and how does their body feel in that life?"
health_foundation       = "How does being physically healthy and active connect to their valued life, and what does staying active look like for them?"
future_self_description = "How do they describe their ideal future self — what does a day in that life look like, and what is the visual or emotional snapshot?"
# The DURATION is no longer asked here — the horizon picker below collects it
# as a fixed choice, so the conversation does not ask the same thing twice.
# This field now holds only the qualitative half: what the future self is
# anchored to. The column name stays `timeline` so the sheet needs no change.
timeline                = "Is this future self connected to any life event, milestone, or expected change — and if so, what?"

# Story personas (same 3 options as before)
[summaries.personas]

steppy = """You are Steppy, a warm but understated storyteller. Write a short, grounded micro-narrative in first person that captures this person's ideal future self — grounded in their values and their active, healthy life. Use plain, direct language; avoid ornate, poetic, or overly emotive phrasing. Keep it concise — no more than a short paragraph. Write only about the future self being described: do not reference anything the person said about what they currently lack, struggle with, or their past. Focus entirely on the future, active, values-aligned version of them, described simply and matter-of-factly, without excessive enthusiasm."""

sunny = """You are Sunny, a deeply empathetic and reflective narrator. Write a rich, heartfelt micro-narrative in first person that brings this person's ideal future self to life — weaving together their values, their physical vitality, and the life they are building. Use vivid, emotionally resonant language. The story should feel like a personal journal entry — warm, meaningful, and full of feeling. Aim for 2–3 paragraphs."""

maple = """You are Maple, a grounded and clear-eyed narrator. Write a concise micro-narrative in first person that honestly reflects this person's values, their commitment to their health and active life, and the future self they are becoming. Use straightforward, confident, factual language. Focus on patterns, purpose, and clarity. Keep it structured and affirming."""

# One-shot example — ideal future self with PA integration
[example]

conversation = """
Question: What do you value deeply in your life?
Answer: Being present for my family, staying connected to nature, and feeling strong in my body as I get older.
Question: What does a life that honors those values look and feel like — and how does your body feel in it?
Answer: I'm not rushing. I have energy for the people I love. My body feels capable — not perfect, but reliable. I can go on a long walk with my daughter without thinking twice about it.
Question: How does being healthy and active connect to that life?
Answer: It's what makes everything else possible. When I'm not active I feel foggy and irritable. When I am, I show up better — for my family, for my work, for myself.
Question: Picture your ideal future self — what does a day in that life look like?
Answer: I wake up early and go for a walk before anyone else is up. The rest of the day feels manageable. I'm not just surviving — I'm actually present.
Question: How far away does this version of you feel?
Answer: A year or two. I'm already closer than I think.
"""

scenario = """I move through my days with a quiet kind of strength. Each morning, I make time to be active — not because I have to, but because I've learned that this is what makes everything else possible. My body feels capable and alive, and that aliveness spills into how I show up for the people I love. I am present. I am not just keeping up — I am actually here, in my life, building it with intention. This is the person I am becoming."""

# ─── ANCHORING PROMPTS ───────────────────────────────────────────────────────
# Shown as a sentence-completion form after the conversation.
# Responses are stored with the field names below — these map directly
# to the Qualtrics Contact List embedded data fields for the check-in system.

[anchoring]

# Nine prompts, in the order participants see them. The order here must
# match the `fields` list below, item for item — they are zipped together.
#
# The last two are deliberately different in kind from the first seven.
# The first seven are obstacles to work around; anchor_cant and
# anchor_rest are for days where being active is not going to happen,
# and their job is to acknowledge that without implying failure.
prompts = [
    "On a day that feels fully aligned with my values, I am someone who",
    "When the weather or outdoor conditions make it hard to be active, I am someone who",
    "When I'm too busy or my routine gets disrupted, I am someone who",
    "When I'm away from home or traveling, I am someone who",
    "When my body isn't feeling its best, I am someone who",
    "When I don't have access to my usual place or equipment to be active, I am someone who",
    "When something unexpected gets in the way of being active, I am someone who",
    "When life gets in the way and being active feels out of reach, I am someone who",
    "On days when rest is what I truly need, I am someone who"
]

# Field names — must match the Chatbot1 tab column headings exactly.
#
# anchor_other  → shown when a participant taps the "Something else"
#                 barrier chip on a day they still plan to be active.
# anchor_cant   → shown on a day the participant reports they cannot be
#                 active at all. Previously this field's wording lived
#                 under anchor_other, which conflated the two.
fields = [
    "anchor_ideal",
    "anchor_weather",
    "anchor_busy",
    "anchor_travel",
    "anchor_physical",
    "anchor_access",
    "anchor_other",
    "anchor_cant",
    "anchor_rest"
]

# ─── TIMELINE HORIZON ────────────────────────────────────────────────────────
# Asked once, right after the Topic 1 conversation, before the anchoring form.
#
# The participant's answer is LOCKED and reused verbatim in every later FSCQ
# administration — the weekly 3-item measure during the trial and the full
# instrument at each endpoint. A stem reading "2 years" post-chatbot and
# "5 years" at endpoint would confound within-person change with horizon
# drift, which is why this is a fixed choice and not free text.
#
# `stored` is the full prepositional phrase, so one template serves every
# option: "How similar are you now to who you will be {HORIZON}?"
#
# RETIREMENT
# Retirement is offered as a fifth framing because it is how many adults in
# this age range actually describe their future, but it does not itself give
# a number. Picking it therefore asks one follow-up for the duration, and
# what gets STORED is still a duration. That keeps every FSCQ stem uniform
# and every participant's horizon orderable — which the analysis needs, since
# continuity runs higher for nearer horizons and that has to be accounted
# for. An already-retired participant simply will not choose it.
#
# `framing` records which route they took, for the Session 1 interview and
# for reporting how this population construes its future self. It does not
# affect any stem.

[horizon]

question = "One last thing about that future version of yourself — roughly how far away does this person feel to you?"

helper = "Pick whichever is closest. There's no right answer, and this just helps us ask you about that same future self in the same way each time."

# Shown only after the retirement option is chosen.
followup = "And about how many years from now do you expect that to be?"

followup_helper = "Your best guess is fine."

[[horizon.options]]
label  = "About 1 year from now"
stored = "in 1 year"

[[horizon.options]]
label  = "About 2 years from now"
stored = "in 2 years"

[[horizon.options]]
label  = "About 5 years from now"
stored = "in 5 years"

[[horizon.options]]
label  = "About 10 years from now"
stored = "in 10 years"

# No `stored` value — this one asks the follow-up instead.
[[horizon.options]]
label      = "Around when I retire"
ask_years  = true
